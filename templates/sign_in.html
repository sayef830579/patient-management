
<!DOCTYPE html>
<html>
<head>
    <title>Patient Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/sign_in.css') }}">
</head>

<body>

    <div class="box">

        <h2>Sign In</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('sign_in') }}" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">Login</button>

        </form>

        <h6>
            You don't have an account?
            <a href="{{ url_for('sign_up') }}">Sign Up</a>
        </h6>

    </div>

</body>
</html>
