
<!DOCTYPE html>
<html>
<head>
    <title>Patient Sign Up</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/sign_up.css') }}">
</head>
<body>

    <div class="box">

        <h2>Sign Up</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('sign_up') }}" method="POST">

            <input
                type="text"
                name="full_name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">Create Account</button>

        </form>

        <h6>
            Already have an account?
            <a href="{{ url_for('sign_in') }}">Sign In</a>
        </h6>

    </div>

</body>
</html>
